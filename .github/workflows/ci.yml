name: CI

on:
  pull_request:
  push:
    branches: [main]

# A force-push or a second push to the same PR makes the earlier run pointless.
# Cancel it rather than paying for a result nobody will read. `main` is excluded
# from cancellation so the history of what passed on the default branch stays
# complete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  matcher:
    name: Matcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            matcher/requirements.lock
            matcher/requirements-embeddings.lock
      - run: python -m pip install -r matcher/requirements.lock -r matcher/requirements-embeddings.lock -e './matcher[test,embeddings]'
      - run: python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build

      # The browser tests skip themselves when Chromium is missing, and the
      # semantic-retrieval tests skip when the embedding extra is absent. A
      # skipped test looks like a passing one in the summary, so assert the
      # count instead of trusting a green tick.
      - name: Test
        run: python -m pytest matcher/tests -q --no-header -p no:randomly

      - name: Assert the browser and embedding suites actually ran
        run: |
          for suite in matcher/tests/test_crawler.py matcher/tests/test_retrieval.py; do
            if python -m pytest "$suite" -q --no-header 2>&1 | grep -qE '[1-9][0-9]* skipped'; then
              echo "::error::$suite skipped tests in CI — Chromium or the embedding extra is missing"
              exit 1
            fi
          done

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly the lockfile and
      # fails if package.json and the lock have drifted, which is the check we
      # want on a PR.
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse committed environment files
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' || true)
          if [ -n "$tracked" ]; then
            echo "::error::environment files are tracked by git:"
            echo "$tracked"
            exit 1
          fi

      - name: Refuse committed DeepSeek credential files
        run: |
          if git ls-files --error-unmatch deepseek_api.txt >/dev/null 2>&1; then
            echo "::error::deepseek_api.txt must stay local and ignored"
            exit 1
          fi

      - name: Refuse committed crawl data or resumes
        run: |
          tracked=$(git ls-files | grep -E '^\.sww/|^uploads/|\.(pdf|docx)$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::local crawl data or resume files are tracked by git:"
            echo "$tracked"
            exit 1
          fi
