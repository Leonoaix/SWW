<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard · JSM</title>
    <!-- See index.html: gates every "start hidden" reveal rule on JS being on. -->
    <script>
      document.documentElement.classList.add("js");
    </script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar" data-reveal>
        <div class="topbar-brand">
          <span class="brand-mark">J</span>
          JSM
        </div>
        <div class="topbar-actions">
          <a href="/waterlooworks.html" class="btn btn-ghost">WaterlooWorks 匹配</a>
          <button id="new-application-btn" class="btn btn-primary">+ New Application</button>
          <div class="user-menu">
            <span id="user-avatar" class="avatar"></span>
            <span id="user-name" class="user-name"></span>
            <button id="change-password-btn" class="btn btn-ghost">Change password</button>
            <button id="logout-btn" class="btn btn-ghost">Log out</button>
          </div>
        </div>
      </header>

      <main>
        <section class="stats" id="stats" aria-label="Pipeline summary"></section>
        <section class="pipeline" id="pipeline" aria-label="Pipeline distribution"></section>

        <section class="toolbar" aria-label="Filter applications">
          <div class="search-field">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <line x1="16.5" y1="16.5" x2="21" y2="21" stroke-linecap="round" />
            </svg>
            <input
              id="search-input"
              type="search"
              placeholder="Search company, role, tag, or notes…"
              autocomplete="off"
              aria-label="Search applications"
            />
          </div>

          <div class="filter-group" id="status-filter" role="group" aria-label="Filter by status"></div>

          <button id="clear-filters" class="btn btn-ghost btn-sm" hidden>Clear</button>
          <span id="result-count" class="result-count" aria-live="polite"></span>
        </section>

        <p id="board-error" class="board-error" role="alert" hidden></p>
        <section class="board" id="board" aria-label="Applications board"></section>
      </main>
    </div>

    <!-- Native <dialog>: Esc-to-close, backdrop, and focus containment come
         from the browser rather than from hand-rolled JS. -->
    <dialog id="editor" class="dialog" aria-labelledby="editor-title">
      <form id="editor-form" method="dialog" novalidate>
        <header class="dialog-head">
          <h2 id="editor-title">New application</h2>
          <button type="button" id="editor-close" class="icon-btn" aria-label="Close">&times;</button>
        </header>

        <div class="dialog-body">
          <p id="editor-error" class="form-error" role="alert" hidden></p>

          <div class="field-row">
            <div class="field">
              <label for="f-company">Company <span class="req" aria-hidden="true">*</span></label>
              <input id="f-company" name="company_name" required maxlength="200" />
            </div>
            <div class="field">
              <label for="f-title">Role <span class="req" aria-hidden="true">*</span></label>
              <input id="f-title" name="position_title" required maxlength="200" />
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="f-status">Status</label>
              <select id="f-status" name="status"></select>
            </div>
            <div class="field">
              <label for="f-applied">Applied on</label>
              <input id="f-applied" name="applied_at" type="date" />
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="f-location">Location <span class="hint">comma separated</span></label>
              <input id="f-location" name="location" placeholder="Remote, Austin TX" />
            </div>
            <div class="field">
              <label for="f-tags">Tags <span class="hint">comma separated</span></label>
              <input id="f-tags" name="tags" placeholder="go, backend" />
            </div>
          </div>

          <div class="field">
            <label for="f-link">Job link</label>
            <input id="f-link" name="job_link" type="url" placeholder="https://…" />
          </div>

          <div class="field">
            <label for="f-followup">Next follow-up</label>
            <input id="f-followup" name="next_follow_up_at" type="date" />
          </div>

          <div class="field">
            <label for="f-notes">Notes</label>
            <textarea id="f-notes" name="notes" rows="4"></textarea>
          </div>
        </div>

        <footer class="dialog-foot">
          <button type="button" id="editor-delete" class="btn btn-danger" hidden>Delete</button>
          <span class="spacer"></span>
          <button type="button" id="editor-cancel" class="btn btn-ghost">Cancel</button>
          <button type="submit" id="editor-save" class="btn btn-primary">Save</button>
        </footer>
      </form>
    </dialog>

    <dialog id="password-dialog" class="dialog dialog-narrow" aria-labelledby="password-title">
      <form id="password-form" method="dialog" novalidate>
        <header class="dialog-head">
          <h2 id="password-title">Change password</h2>
          <button type="button" id="password-close" class="icon-btn" aria-label="Close">&times;</button>
        </header>

        <div class="dialog-body">
          <p id="password-error" class="form-error" role="alert" hidden></p>

          <p class="dialog-note">
            You'll be signed out and asked to sign in again with the new password.
          </p>

          <div class="field">
            <label for="p-current">Current password</label>
            <input id="p-current" type="password" autocomplete="current-password" required />
          </div>

          <div class="field">
            <label for="p-new">New password</label>
            <input id="p-new" type="password" autocomplete="new-password" required />
            <!-- Mirrors enforcePasswordComplexity in internal/service/auth.go.
                 Stated up front so the rules aren't discovered one 400 at a
                 time; the server remains the authority. -->
            <p class="field-hint">
              At least 8 characters, with one uppercase letter and one special character.
            </p>
          </div>

          <div class="field">
            <label for="p-confirm">Confirm new password</label>
            <input id="p-confirm" type="password" autocomplete="new-password" required />
          </div>
        </div>

        <footer class="dialog-foot">
          <span class="spacer"></span>
          <button type="button" id="password-cancel" class="btn btn-ghost">Cancel</button>
          <button type="submit" id="password-save" class="btn btn-primary">Change password</button>
        </footer>
      </form>
    </dialog>

    <script type="module" src="/src/dashboard.ts"></script>
  </body>
</html>
